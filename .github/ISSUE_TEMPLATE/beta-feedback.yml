name: Beta feedback
description: Report a Keyboard Settings public-beta result or problem
title: "[Beta]: "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the public beta. Please do not attach raw key events, typed text, usernames or home paths, device serial numbers, raw configuration files, `hyprctl devices` output, or helper `status` output.

  - type: dropdown
    id: area
    attributes:
      label: Test area
      options:
        - Fresh install, update, or removal
        - Different replacement keyboard
        - Layouts, variants, typing, or shortcut
        - Popup, focus, bar edge, or display scale
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Omarchy, Hyprland, and Quickshell versions. Add the bar edge and display scale when relevant.
      placeholder: |
        Omarchy:
        Hyprland:
        Quickshell:
        Bar edge and display scale:
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the steps and observed result in your own words. Do not include captured input or private configuration.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics (optional)
      description: Paste the output of `python3 tools/diagnostics.py` if it helps. Review it before submitting.
      render: json

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and removed raw key events, typed text, usernames or home paths, device serial numbers, raw configuration, `hyprctl devices` output, and helper `status` output.
          required: true
