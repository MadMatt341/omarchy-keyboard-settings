name: Marketplace review drift

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test review report handling
        run: python3 -B -m unittest discover -s tests -p test_marketplace_review.py -v
      - name: Compare published main with marketplace reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/check_marketplace_review.py
